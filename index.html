<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Математика — обучающая платформа</title>
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
  <div id="app"></div>

  <!-- Модалка с фактом -->
  <div class="fact-modal" id="factModal">
    <div class="fact-content">
      <div class="fact-emoji" id="factEmoji">🖐️</div>
      <div class="fact-era" id="factEra">Древний мир</div>
      <h3 class="fact-title" id="factTitle">Пальцы</h3>
      <p class="fact-text" id="factText">Текст факта</p>
      <button class="btn" id="factClose">Закрыть</button>
    </div>
  </div>

  <!-- ВАЖНО: подключаем как модуль! -->
  <script type="module">
    import { initRouter } from './assets/js/router.js';
    import { hideFactModal } from './assets/js/core.js';

    initRouter();

    document.getElementById('factClose')?.addEventListener('click', hideFactModal);
    document.getElementById('factModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'factModal') hideFactModal();
    });
  </script>
</body>
</html>
