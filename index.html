<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Состав чисел 2–10 — Ярослав</title>
<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --text: #1a2233;
    --muted: #5b6b85;
    --num: #1976d2;
    --op: #d32f2f;
    --card-bg: #ffffff;
    --card-border: #cfd8e3;
    --card-sel: #ffe082;
    --card-sel-border: #ffb300;
    --house-bg: #ffffff;
    --house-shadow: 0 4px 14px rgba(30,60,120,.12);
    --slot-bg: #eef3fa;
    --slot-border: #c7d3e3;
    --slot-pop: #7ed957;
    --ghost: #b39ddb;
    --hint: #ffd54f;
    --star: #f5b301;
    --btn-bg: #e8eef7;
    --btn-active: #1976d2;
    --btn-active-text: #ffffff;
    --win-bg: rgba(255,255,255,.92);
  }
  [data-theme="dark"] {
    --bg: #12161f;
    --panel: #1b2130;
    --text: #e8edf5;
    --muted: #9aa8bd;
    --num: #64b5f6;
    --op: #ef5350;
    --card-bg: #232b3d;
    --card-border: #35405a;
    --card-sel: #5c4a1a;
    --card-sel-border: #ffb300;
    --house-bg: #1b2130;
    --house-shadow: 0 4px 14px rgba(0,0,0,.4);
    --slot-bg: #232b3d;
    --slot-border: #35405a;
    --slot-pop: #4caf50;
    --ghost: #7e57c2;
    --hint: #ffb300;
    --star: #ffca28;
    --btn-bg: #232b3d;
    --btn-active: #64b5f6;
    --btn-active-text: #0b1220;
    --win-bg: rgba(18,22,31,.94);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s, color .25s;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  /* ---------- Шапка ---------- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding: 8px 14px;
    background: var(--panel);
    box-shadow: 0 2px 10px rgba(30,60,120,.08);
    z-index: 5;
  }
  .brand {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--num);
    white-space: nowrap;
  }
  .brand small { color: var(--muted); font-weight: normal; font-size: .8rem; }
  .spacer { flex: 1 1 auto; }
  .stats {
    display: flex;
    gap: 14px;
    font-size: .95rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .stats b { color: var(--star); }
  .stats .done b { color: var(--num); }
  /* Сегмент-переключатели */
  .seg {
    display: inline-flex;
    background: var(--btn-bg);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    font-family: inherit;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .seg button.active {
    background: var(--btn-active);
    color: var(--btn-active-text);
    font-weight: bold;
  }
  .icon-btn {
    font-family: inherit;
    border: none;
    background: var(--btn-bg);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.2rem;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .icon-btn:active { transform: scale(.94); }
  .label-sm {
    font-size: .72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .control-group { display: flex; flex-direction: column; gap: 2px; }

  /* ---------- Игровое поле ---------- */
  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 10px;
    gap: 10px;
  }
  #houses {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    overflow: auto;
  }
  .house {
    background: var(--house-bg);
    border-radius: 14px;
    box-shadow: var(--house-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px;
    cursor: pointer;
    transition: transform .1s, box-shadow .15s;
    min-height: 90px;
    position: relative;
  }
  .house:active { transform: scale(.985); }
  .house-title {
    font-size: 1.5rem;
    font-weight: bold;
    margin: 2px 0 6px;
    cursor: pointer;
    user-select: none;
    padding: 0 8px;
    border-radius: 8px;
    transition: background .15s;
  }
  .house-title:active { background: var(--hint); }
  .slots {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1 1 auto;
  }
  .slot {
    width: 46px; height: 46px;
    border-radius: 10px;
    background: var(--slot-bg);
    border: 2px dashed var(--slot-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--num);
    transition: transform .18s, background .18s, border-color .18s, color .18s;
  }
  .slot.filled {
    background: var(--card-sel);
    border: 2px solid var(--card-sel-border);
    border-style: solid;
  }
  .slot.pop { animation: slot-pop .35s ease; }
  @keyframes slot-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); background: var(--slot-pop); color: #fff; border-color: var(--slot-pop); }
    100% { transform: scale(1); }
  }
  .slot.ghost {
    color: var(--ghost);
    border-color: var(--ghost);
    border-style: dashed;
    opacity: .85;
  }
  .op-sign {
    color: var(--op);
    font-size: 1.2rem;
    font-weight: bold;
    user-select: none;
  }

  /* ---------- Банк карточек ---------- */
  #tray {
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 14px;
    box-shadow: var(--house-shadow);
    padding: 8px 10px;
    max-height: 38vh;
    overflow: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }
  .card {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--num);
    cursor: pointer;
    transition: transform .1s, background .15s, border-color .15s, box-shadow .15s;
    user-select: none;
  }
  .card:active { transform: scale(.94); }
  .card.selected {
    background: var(--card-sel);
    border-color: var(--card-sel-border);
    box-shadow: 0 0 0 3px var(--card-sel-border) inset;
    transform: translateY(-2px);
  }
  .card.hint-glow {
    animation: hint-glow .6s ease;
    box-shadow: 0 0 0 4px var(--hint);
  }
  @keyframes hint-glow {
    0%, 100% { box-shadow: 0 0 0 4px var(--hint); }
    50% { box-shadow: 0 0 0 8px var(--hint); }
  }
  .card.used { visibility: hidden; pointer-events: none; }
  .tray-empty {
    color: var(--muted);
    font-size: .95rem;
    padding: 10px;
  }

  /* ---------- Кнопки внизу ---------- */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .action-btn {
    font-family: inherit;
    flex: 1 1 auto;
    min-width: 130px;
    border: none;
    background: var(--btn-bg);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: .95rem;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .action-btn:active { transform: scale(.97); }
  .action-btn.primary { background: var(--num); color: #fff; }
  .action-btn.warn { background: var(--op); color: #fff; }

  /* ---------- Оверлей победы ---------- */
  #win {
    position: fixed;
    inset: 0;
    background: var(--win-bg);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 50;
    padding: 24px;
    text-align: center;
  }
  #win.show { display: flex; }
  #win h1 { font-size: 2rem; margin: 0; color: var(--num); }
  #win p { font-size: 1.1rem; color: var(--muted); margin: 0; }
  #win .action-btn { flex: 0 0 auto; min-width: 180px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* ---------- Планшет альбомная: 9 колонок ---------- */
  @media (min-width: 700px) and (orientation: landscape) {
    #houses {
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: 1fr;
    }
    .house { min-height: 0; }
    .slot { width: 40px; height: 40px; font-size: 1.1rem; }
    .house-title { font-size: 1.3rem; }
    #tray { max-height: 45vh; }
  }

  /* ---------- Телефон портрет: карусель ---------- */
  @media (max-width: 699px) {
    #houses {
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      gap: 10px;
    }
    #houses .house {
      flex: 0 0 78%;
      scroll-snap-align: center;
    }
    #tray { max-height: 35vh; }
    header { padding: 6px 10px; gap: 6px 10px; }
    .brand { font-size: 1rem; }
    .stats { font-size: .85rem; gap: 10px; }
    .seg button { padding: 5px 8px; font-size: .82rem; }
    .icon-btn { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🧮 Состав чисел <small>для Ярослава</small></div>

    <div class="control-group">
      <span class="label-sm">Уровень</span>
      <div class="seg" id="segLevel">
        <button data-level="low">2–5</button>
        <button data-level="high">6–10</button>
        <button data-level="all" class="active">Все</button>
      </div>
    </div>

    <div class="control-group">
      <span class="label-sm">Режим</span>
      <div class="seg" id="segMode">
        <button data-mode="add" class="active">➕ Сложение</button>
        <button data-mode="sub">➖ Вычитание</button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="stats">
      <span class="stars">⭐ <b id="starsCount">0</b></span>
      <span class="done">Собрано: <b id="doneCount">0/9</b></span>
    </div>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  </header>

  <main>
    <section id="houses" aria-label="Домики чисел"></section>
    <section id="tray" aria-label="Банк карточек"></section>
    <div class="actions">
      <button class="action-btn" id="sampleBtn">Показать образец</button>
      <button class="action-btn warn" id="resetBtn">Сбросить прогресс</button>
    </div>
  </main>
</div>

<div id="win">
  <h1>🎉 Победа! 🎉</h1>
  <p id="winText">Все домики собраны!</p>
  <button class="action-btn primary" id="winAgain">Играть снова</button>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";

/* ==================== Константы ==================== */
const ALL_NUMBERS = [2,3,4,5,6,7,8,9,10];
const LEVELS = {
  low: [2,3,4,5],
  high: [6,7,8,9,10],
  all: [2,3,4,5,6,7,8,9,10]
};
const STORAGE_KEY = "yaroslav_progress_v18";
const THEME_KEY = "yaroslav_theme_v18";

const HOUSE_COLORS = {
  2:"#e57373", 3:"#ffb74d", 4:"#fff176", 5:"#aed581",
  6:"#4db6ac", 7:"#64b5f6", 8:"#9575cd", 9:"#f06292", 10:"#a1887f"
};

/* ==================== Состояние ==================== */
const state = {
  level: "all",
  mode: "add",      // "add" | "sub"
  theme: "light",
  // progress[mode][number] = [slot0|null, slot1|null]
  progress: {
    add: {},
    sub: {}
  },
  selectedCard: null,   // значение выбранной карточки
  usedCards: [],        // значения карточек, уже стоящих в домиках (для банка)
  showGhosts: false
};

/* ==================== Загрузка/сохранение ==================== */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.add && data.sub) {
        state.progress = data;
      }
    }
  } catch (e) { console.warn("progress load error", e); }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); }
  catch (e) { console.warn("progress save error", e); }
}
function loadTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (t === "dark" || t === "light") state.theme = t;
}
function saveTheme() {
  localStorage.setItem(THEME_KEY, state.theme);
}

/* ==================== Утилиты ==================== */
function currentNumbers() {
  return LEVELS[state.level];
}
function currentModeProgress() {
  return state.progress[state.mode];
}
function ensureNumberProgress(n) {
  const p = currentModeProgress();
  if (!p[n]) p[n] = [null, null];
  return p[n];
}
function isHouseComplete(n) {
  const p = currentModeProgress()[n];
  return p && p[0] !== null && p[1] !== null;
}
function isHouseEmpty(n) {
  const p = currentModeProgress()[n];
  return !p || (p[0] === null && p[1] === null);
}
function completedCount() {
  return currentNumbers().filter(isHouseComplete).length;
}
function totalNumbers() {
  return currentNumbers().length;
}
function recomputeUsedCards() {
  // Карточки в банке — это 1..9, каждая по одному экземпляру,
  // но т.к. в домике 2 ячейки и чисел 9, а карточек нужно больше —
  // банк генерирует "виртуальные" карточки: для каждого числа 1..9
  // столько копий, сколько нужно по всем домикам? 
  // Упростим: банк всегда содержит карточки 1..9, и любая карточка
  // может использоваться многократно. Чтобы не усложнять — банк
  // не "тратится", а карточки-подсказки подсвечиваются.
  // usedCards нужен только для подсветки образца. Оставим пустым.
  state.usedCards = [];
}

/* ==================== Логика проверки размещения ==================== */
/**
 * Проверяет, можно ли карточку c поставить в домик числа N.
 * Возвращает {ok:true, slotIndex:0|1} или {ok:false}.
 * Режим add: N = a + b. Карточка c подходит в свободную ячейку,
 *   если вторая ячейка пуста ИЛИ вторая ячейка = N - c.
 * Режим sub: N - a = b. Карточка c подходит:
 *   - если обе пусты: ставим c в slot0 (тогда slot1 должен быть N-c)
 *     или в slot1 (тогда slot0 должен быть N-c). Примем: c идёт в slot0,
 *     а slot1 = N - c (если 1<=N-c<=9).
 *   - если slot0 занят a: c идёт в slot1, если N - a === c.
 *   - если slot1 занят b: c идёт в slot0, если N - c === b.
 */
function canPlace(n, c) {
  const p = ensureNumberProgress(n);
  const [a, b] = p;
  if (state.mode === "add") {
    if (a !== null && b !== null) return { ok:false };
    if (a === null && b === null) return { ok:true, slotIndex:0 };
    if (a === null) return (b + c === n) ? { ok:true, slotIndex:0 } : { ok:false };
    // b === null
    return (a + c === n) ? { ok:true, slotIndex:1 } : { ok:false };
  } else {
    // sub: N - a = b
    if (a !== null && b !== null) return { ok:false };
    if (a === null && b === null) {
      // c в slot0, slot1 = N - c
      if (n - c >= 1 && n - c <= 9) return { ok:true, slotIndex:0 };
      return { ok:false };
    }
    if (a === null) {
      // b занят: c в slot0, если N - c === b
      return (n - c === b) ? { ok:true, slotIndex:0 } : { ok:false };
    }
    // b === null: c в slot1, если N - a === c
    return (n - a === c) ? { ok:true, slotIndex:1 } : { ok:false };
  }
}

/* ==================== Отрисовка ==================== */
const housesEl = document.getElementById("houses");
const trayEl = document.getElementById("tray");
const starsEl = document.getElementById("starsCount");
const doneEl = document.getElementById("doneCount");

function renderHeader() {
  starsEl.textContent = completedCount();
  doneEl.textContent = completedCount() + "/" + totalNumbers();
}

function renderHouses() {
  housesEl.innerHTML = "";
  const numbers = currentNumbers();
  // Сетка 3x3 под ПК: если чисел <9, всё равно оставляем сетку,
  // но домиков будет меньше. Для красоты дополним пустыми? Нет — просто
  // grid сам растянет.
  numbers.forEach(n => {
    housesEl.appendChild(buildHouse(n));
  });
}

function buildHouse(n) {
  const house = document.createElement("div");
  house.className = "house";
  house.dataset.number = n;

  const title = document.createElement("div");
  title.className = "house-title";
  title.style.color = HOUSE_COLORS[n] || "var(--num)";
  title.textContent = n;
  title.addEventListener("click", (e) => {
    e.stopPropagation();
    showHint(n);
  });
  house.appendChild(title);

  const slots = document.createElement("div");
  slots.className = "slots";

  const p = ensureNumberProgress(n);
  // В режиме сложения: a + b = n (между ячейками "+")
  // В режиме вычитания: n - a = b (между ячейками "−", после n идёт "="? 
  //   Нет: домик показывает N, внутри: [a] − [b]? Педагогически:
  //   N − a = b, т.е. в домике показываем [a] и [b], а N — заголовок.
  //   Между ячейками ставим "−" и "=" не нужен, т.к. N в заголовке.
  //   Для наглядности: [a] − [b]? Нет, это N − a = b.
  //   Покажем: (N) − [a] = [b]? Заголовок уже N.
  //   Тогда внутри: "−" [a] "=" [b]? Слишком громоздко.
  //   Компромисс: показываем [a] и [b] с знаком "−" между ними,
  //   а заголовок N означает "N − a = b". Ребёнок поймёт из режима.
  //   Но чтобы было однозначно, поставим перед первым слотом "N −"?
  //   Проще: слева от слотов маленький знак "−" и "=".
  //   Итог: [slots] = [a] [−] [b], а N в заголовке = уменьшаемое.
  //   Это может путать. Сделаем явно: в заголовке "N", внутри "N − [a] = [b]"
  //   не влезет. Поэтому: [a] [−] [b], а над домиком N — это N.
  //   Принимаем: в режиме sub домик N означает N − a = b,
  //   отображаем [a] [−] [b]. Подсказка по заголовку объяснит.
  
  const slot0 = document.createElement("div");
  slot0.className = "slot";
  slot0.dataset.slot = "0";
  if (p[0] !== null) { slot0.textContent = p[0]; slot0.classList.add("filled"); }
  else if (state.showGhosts) { slot0.textContent = ghostValue(n, 0); slot0.classList.add("ghost"); }

  const op = document.createElement("div");
  op.className = "op-sign";
  op.textContent = state.mode === "add" ? "+" : "−";

  const slot1 = document.createElement("div");
  slot1.className = "slot";
  slot1.dataset.slot = "1";
  if (p[1] !== null) { slot1.textContent = p[1]; slot1.classList.add("filled"); }
  else if (state.showGhosts) { slot1.textContent = ghostValue(n, 1); slot1.classList.add("ghost"); }

  slots.appendChild(slot0);
  slots.appendChild(op);
  slots.appendChild(slot1);
  house.appendChild(slots);

  house.addEventListener("click", () => onHouseClick(n));
  return house;
}

function ghostValue(n, slotIndex) {
  // Образец: подбираем пару
  if (state.mode === "add") {
    // a + b = n; возьмём a = 1, b = n-1 (если n>2), иначе a=1,b=1 для n=2
    if (n === 2) return 1;
    const a = 1, b = n - 1;
    return slotIndex === 0 ? a : b;
  } else {
    // n - a = b; возьмём a = 1, b = n-1
    if (n === 2) return slotIndex === 0 ? 1 : 1;
    const a = 1, b = n - 1;
    return slotIndex === 0 ? a : b;
  }
}

function renderSingleHouse(n) {
  const old = housesEl.querySelector('.house[data-number="' + n + '"]');
  if (old) {
    const fresh = buildHouse(n);
    old.replaceWith(fresh);
  }
}

function renderTray() {
  trayEl.innerHTML = "";
  for (let c = 1; c <= 9; c++) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.value = c;
    card.textContent = c;
    if (state.selectedCard === c) card.classList.add("selected");
    card.addEventListener("click", () => onCardClick(c));
    trayEl.appendChild(card);
  }
}

function renderAll() {
  renderHouses();
  renderTray();
  renderHeader();
  applyTheme();
}

/* ==================== Взаимодействие ==================== */
function onCardClick(c) {
  if (state.selectedCard === c) {
    state.selectedCard = null;
  } else {
    state.selectedCard = c;
  }
  renderTray(); // перерисовываем только банк (сохраняем скролл)
}

function onHouseClick(n) {
  if (state.selectedCard === null) {
    // нет выбранной карточки — можно показать подсказку по домику
    return;
  }
  const c = state.selectedCard;
  const res = canPlace(n, c);
  if (!res.ok) {
    // неверно — лёгкая тряска
    const house = housesEl.querySelector('.house[data-number="' + n + '"]');
    if (house) {
      house.animate(
        [{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],
        {duration:220}
      );
    }
    beep(false);
    return;
  }
  // ставим
  const p = ensureNumberProgress(n);
  p[res.slotIndex] = c;
  saveProgress();
  state.selectedCard = null;
  renderSingleHouse(n);
  renderTray();
  renderHeader();
  // анимация pop
  const slot = housesEl.querySelector('.house[data-number="' + n + '"] .slot[data-slot="' + res.slotIndex + '"]');
  if (slot) { slot.classList.add("pop"); }
  beep(true);
  // проверка победы
  if (completedCount() === totalNumbers()) {
    showWin();
  }
}

/* ==================== Подсказка ==================== */
let hintTimer = null;
function showHint(n) {
  // подсветить карточки, которые подходят в домик n
  const cards = trayEl.querySelectorAll(".card");
  cards.forEach(card => card.classList.remove("hint-glow"));
  cards.forEach(card => {
    const c = parseInt(card.dataset.value, 10);
    const res = canPlace(n, c);
    if (res.ok) card.classList.add("hint-glow");
  });
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    cards.forEach(card => card.classList.remove("hint-glow"));
  }, 2000);
}

/* ==================== Образец ==================== */
document.getElementById("sampleBtn").addEventListener("click", () => {
  state.showGhosts = true;
  renderHouses();
  // через 2.5 сек убрать призраков
  setTimeout(() => {
    state.showGhosts = false;
    renderHouses();
  }, 2500);
});

/* ==================== Сброс прогресса ==================== */
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить прогресс текущего режима (" + (state.mode === "add" ? "сложение" : "вычитание") + ")?")) return;
  state.progress[state.mode] = {};
  state.selectedCard = null;
  state.showGhosts = false;
  saveProgress();
  renderAll();
});

/* ==================== Победа ==================== */
function showWin() {
  const win = document.getElementById("win");
  const txt = document.getElementById("winText");
  txt.textContent = "Все " + totalNumbers() + " домиков собраны в режиме «" +
    (state.mode === "add" ? "Сложение" : "Вычитание") + "»!";
  win.classList.add("show");
  runConfetti();
}
document.getElementById("winAgain").addEventListener("click", () => {
  document.getElementById("win").classList.remove("show");
  state.progress[state.mode] = {};
  state.selectedCard = null;
  saveProgress();
  renderAll();
});

/* ==================== Конфетти ==================== */
function runConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const colors = ["#e57373","#ffb74d","#fff176","#aed581","#4db6ac","#64b5f6","#9575cd","#f06292"];
  const pieces = [];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * w,
      y: -20 - Math.random() * h * 0.5,
      vx: (Math.random() - 0.5) * 2,
      vy: 2 + Math.random() * 3,
      size: 6 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2
    });
  }
  let start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, w, h);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (t < 3000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, w, h);
  }
  requestAnimationFrame(frame);
}

/* ==================== Звук ==================== */
let audioCtx = null;
function beep(good) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (good) {
      o.type = "sine";
      o.frequency.setValueAtTime(660, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.12);
    } else {
      o.type = "square";
      o.frequency.setValueAtTime(180, audioCtx.currentTime);
    }
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start();
    o.stop(audioCtx.currentTime + 0.22);
  } catch (e) {}
}

/* ==================== Тема ==================== */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const btn = document.getElementById("themeBtn");
  btn.textContent = state.theme === "dark" ? "☀️" : "🌙";
  btn.title = state.theme === "dark" ? "Светлая тема" : "Тёмная тема";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveTheme();
  applyTheme();
});

/* ==================== Переключатели ==================== */
document.getElementById("segLevel").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-level]");
  if (!btn) return;
  const lvl = btn.dataset.level;
  if (lvl === state.level) return;
  state.level = lvl;
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === lvl));
  state.selectedCard = null;
  state.showGhosts = false;
  renderAll();
});

document.getElementById("segMode").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  const mode = btn.dataset.mode;
  if (mode === state.mode) return;
  state.mode = mode;
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  state.selectedCard = null;
  state.showGhosts = false;
  renderAll();
});

/* ==================== Инициализация ==================== */
function init() {
  loadProgress();
  loadTheme();
  // гарантируем структуру прогресса
  if (!state.progress.add) state.progress.add = {};
  if (!state.progress.sub) state.progress.sub = {};
  // восстановим активные кнопки по состоянию (по умолчанию all/add)
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  renderAll();
}
init();

// сброс скролла карусели при смене уровня — не нужен
window.addEventListener("resize", () => { /* ничего */ });
</script>
