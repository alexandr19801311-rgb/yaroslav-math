<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Состав чисел 2–10 — Ярослав</title>
<style>
  :root {
    --bg: #f0f4f8; --panel: #ffffff; --text: #1a2233; --muted: #5b6b85;
    --num: #1976d2; --op: #d32f2f; --card-bg: #ffffff; --card-border: #90caf9;
    --card-sel: #bbdefb; --card-sel-border: #1976d2; --house-bg: #ffffff;
    --house-shadow: 0 1px 4px rgba(0,0,0,.08); --row-bg: #f4f7fb; --row-border: #cfd8e3;
    --slot-pop: #7ed957; --ghost: #b39ddb; --hint: #ffd54f; --star: #f5b301;
    --btn-bg: #e3f2fd; --btn-text: #1976d2; --btn-active: #1976d2; --btn-active-text: #ffffff;
    --win-bg: rgba(255,255,255,.95); --tray-bg: #fff9e6; --tray-border: #ffcc80;
    --house-2: #e53935; --house-3: #fb8c00; --house-4: #fdd835; --house-5: #7cb342;
    --house-6: #00897b; --house-7: #1e88e5; --house-8: #8e24aa; --house-9: #d81b60; --house-10: #6d4c41;
  }
  [data-theme="dark"] {
    --bg: #12161f; --panel: #1b2130; --text: #e8edf5; --muted: #9aa8bd;
    --num: #64b5f6; --op: #ef5350; --card-bg: #232b3d; --card-border: #35405a;
    --card-sel: #1e3a5f; --card-sel-border: #64b5f6; --house-bg: #1b2130;
    --house-shadow: 0 2px 8px rgba(0,0,0,.4); --row-bg: #232b3d; --row-border: #35405a;
    --slot-pop: #4caf50; --ghost: #7e57c2; --hint: #ffb300; --star: #ffca28;
    --btn-bg: #232b3d; --btn-text: #64b5f6; --btn-active: #64b5f6; --btn-active-text: #0b1220;
    --win-bg: rgba(18,22,31,.95); --tray-bg: #2a2518; --tray-border: #5c4a1a;
    --house-2: #ef5350; --house-3: #ffa726; --house-4: #ffee58; --house-5: #9ccc65;
    --house-6: #26a69a; --house-7: #42a5f5; --house-8: #ab47bc; --house-9: #ec407a; --house-10: #8d6e63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); transition: background .25s, color .25s;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  
  /* ---------- Шапка (только заголовок и счетчики) ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; 
    padding: 8px 12px; background: var(--panel); box-shadow: 0 2px 6px rgba(0,0,0,.05); z-index: 5;
  }
  .brand { font-size: 1.1rem; font-weight: 800; color: var(--num); white-space: nowrap; }
  .stats { display: flex; gap: 12px; font-size: 0.95rem; font-weight: bold; color: var(--muted); white-space: nowrap; }
  .stats .stars { color: var(--star); }

  /* ---------- Игровое поле ---------- */
  main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 8px; gap: 8px; }
  
  /* Домики */
  #houses {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px;
  }
  .house {
    flex: 1 0 80px; min-width: 80px;
    background: var(--house-bg); border-radius: 8px; box-shadow: var(--house-shadow);
    display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--row-border);
  }
  .house-title {
    color: #fff; text-align: center; font-size: 1.1rem; font-weight: bold;
    padding: 6px 0; cursor: pointer; user-select: none;
  }
  .house-title[data-n="2"] { background: var(--house-2); }
  .house-title[data-n="3"] { background: var(--house-3); }
  .house-title[data-n="4"] { background: var(--house-4); color: #333; }
  .house-title[data-n="5"] { background: var(--house-5); }
  .house-title[data-n="6"] { background: var(--house-6); }
  .house-title[data-n="7"] { background: var(--house-7); }
  .house-title[data-n="8"] { background: var(--house-8); }
  .house-title[data-n="9"] { background: var(--house-9); }
  .house-title[data-n="10"] { background: var(--house-10); }
  
  .house-slots {
    flex: 1 1 auto; overflow-y: auto; padding: 4px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .slot {
    background: var(--row-bg); border: 2px dashed var(--row-border);
    border-radius: 6px; padding: 4px 2px; text-align: center; font-size: 0.9rem;
    font-weight: bold; color: var(--num); min-height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .slot.filled { background: var(--card-bg); border: 2px solid var(--card-border); border-style: solid; cursor: default; }
  .slot.ghost { color: var(--ghost); border-color: var(--ghost); border-style: dashed; opacity: .8; }
  .slot.pop { animation: slot-pop .35s ease; }
  @keyframes slot-pop { 40% { transform: scale(1.1); background: var(--slot-pop); color: #fff; border-color: var(--slot-pop); } }

  /* Банк карточек */
  #tray-container {
    flex: 0 0 auto; background: var(--tray-bg); border: 2px dashed var(--tray-border);
    border-radius: 10px; padding: 8px; display: flex; flex-direction: column; max-height: 35vh;
  }
  .tray-header {
    font-size: 0.85rem; font-weight: bold; color: #f57c00; margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  #tray {
    flex: 1 1 auto; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
  }
  .card {
    background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 8px;
    padding: 4px 8px; font-size: 0.95rem; font-weight: bold; color: var(--num);
    cursor: pointer; transition: all .1s; user-select: none; display: flex; align-items: center; justify-content: center;
  }
  .card:active { transform: scale(.95); }
  .card.selected { background: var(--card-sel); border-color: var(--card-sel-border); box-shadow: 0 0 0 2px var(--card-sel-border); }
  .card.hint-glow { animation: hint-glow .6s ease; box-shadow: 0 0 0 4px var(--hint); }
  @keyframes hint-glow { 50% { box-shadow: 0 0 0 8px var(--hint); } }

  /* ---------- Нижняя панель (навигация + кнопки) ---------- */
  .bottom-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 8px 12px; background: var(--panel); box-shadow: 0 -2px 6px rgba(0,0,0,.05); z-index: 5;
  }
  .seg { display: inline-flex; background: var(--btn-bg); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    font-family: inherit; border: none; background: transparent; color: var(--btn-text);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .seg button.active { background: var(--btn-active); color: var(--btn-active-text); }
  .icon-btn {
    font-family: inherit; border: none; background: var(--btn-bg); color: var(--btn-text);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .action-btn {
    font-family: inherit; border: none; background: var(--btn-bg); color: var(--btn-text);
    padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .action-btn.primary { background: var(--btn-active); color: #fff; }
  .action-btn:active { transform: scale(.97); }

  /* Победа */
  #win {
    position: fixed; inset: 0; background: var(--win-bg); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px; z-index: 50;
  }
  #win.show { display: flex; }
  #win h1 { font-size: 2rem; margin: 0; color: var(--num); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* Мобильная адаптация (телефоны) */
  @media (max-width: 600px) {
    .brand { font-size: 0.95rem; }
    .stats { font-size: 0.8rem; gap: 8px; }
    .house { flex: 0 0 75px; min-width: 75px; }
    .slot { font-size: 0.8rem; padding: 4px 0; }
    .bottom-bar { padding: 6px; gap: 6px; }
    .seg button { padding: 4px 6px; font-size: 0.8rem; }
    .action-btn { padding: 6px 10px; font-size: 0.8rem; }
    #tray-container { max-height: 40vh; }
  }

  /* Планшет (альбомная) */
  @media (min-width: 700px) and (orientation: landscape) {
    .house { flex: 1; min-width: 0; }
    .house-title { font-size: 1.2rem; }
    .slot { font-size: 1rem; min-height: 36px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🏠 Состав чисел</div>
    <div class="stats">
      <span class="done" id="doneCount">Собрано: 0 / 9</span>
      <span class="stars">⭐ <b id="starsCount">0</b></span>
    </div>
  </header>

  <main>
    <section id="houses" aria-label="Домики чисел"></section>
    
    <section id="tray-container">
      <div class="tray-header">
        <span>📦 Карточки:</span>
        <span id="trayCount">0 / 0</span>
      </div>
      <div id="tray" aria-label="Банк карточек"></div>
    </section>
  </main>

  <!-- Нижняя панель: навигация и кнопки в одну линию -->
  <div class="bottom-bar">
    <div class="seg" id="segLevel">
      <button data-level="low">2–5</button>
      <button data-level="high">6–10</button>
      <button data-level="all" class="active">Все</button>
    </div>
    
    <div class="seg" id="segMode">
      <button data-mode="add" class="active">➕ Слож.</button>
      <button data-mode="sub">➖ Вычит.</button>
    </div>

    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>

    <div style="flex-grow: 1;"></div>

    <button class="action-btn primary" id="sampleBtn">👁️ Образец</button>
    <button class="action-btn" id="resetBtn">🔄 Заново</button>
  </div>
</div>

<div id="win">
  <h1>🎉 Победа! 🎉</h1>
  <p id="winText">Все домики собраны!</p>
  <button class="action-btn primary" id="winAgain" style="padding:12px 30px; font-size:1.1rem;">Играть снова</button>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";

const LEVELS = {
  low: [2,3,4,5],
  high: [6,7,8,9,10],
  all: [2,3,4,5,6,7,8,9,10]
};
const STORAGE_KEY = "yaroslav_progress_v22";
const THEME_KEY = "yaroslav_theme_v22";

const state = {
  level: "all",
  mode: "add",
  theme: "light",
  progress: { add: {}, sub: {} },
  selectedCard: null,
  tray: [],
  trayInitialSize: 0,
  showGhosts: false
};

/* ==================== Сохранение ==================== */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.add && data.sub) state.progress = data;
    }
  } catch (e) {}
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch (e) {}
}
function loadTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (t === "dark" || t === "light") state.theme = t;
}
function saveTheme() { localStorage.setItem(THEME_KEY, state.theme); }

/* ==================== Утилиты ==================== */
function currentNumbers() { return LEVELS[state.level]; }
function currentModeProgress() { return state.progress[state.mode]; }

function ensureHouseProgress(n) {
  const p = currentModeProgress();
  if (!p[n] || !Array.isArray(p[n]) || p[n].length !== n - 1) {
    p[n] = Array(n - 1).fill(null);
  }
  return p[n];
}

function isHouseComplete(n) {
  const p = currentModeProgress()[n];
  if (!p || p.length !== n - 1) return false;
  return p.every(v => v !== null);
}

function completedCount() { return currentNumbers().filter(isHouseComplete).length; }
function totalNumbers() { return currentNumbers().length; }

/* ==================== Банк карточек ==================== */
function buildTrayFromScratch() {
  const cards = [];
  currentNumbers().forEach(n => {
    if (state.mode === "add") {
      // Добавляем с 0: 0+n, n+0, и все остальные a+(n-a)
      cards.push({ n, a: 0, b: n, text: `0+${n}` });
      cards.push({ n, a: n, b: 0, text: `${n}+0` });
      for (let a = 1; a <= n - 1; a++) {
        const b = n - a;
        cards.push({ n, a, b, text: `${a}+${b}` });
      }
    } else {
      // Вычитание: n-a=b. 
      // a=0: n-0=n. a=n: n-n=0.
      cards.push({ n, a: 0, b: n, text: `${n}-0` });
      cards.push({ n, a: n, b: 0, text: `${n}-${n}` });
      for (let a = 1; a <= n - 1; a++) {
        const b = n - a;
        cards.push({ n, a, b, text: `${n}-${a}` });
      }
    }
  });
  
  // Перемешиваем
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  
  let idCounter = 0;
  state.tray = cards.map(c => ({ ...c, id: ++idCounter }));
  state.trayInitialSize = state.tray.length;
}

function rebuildTrayFromProgress() {
  const cards = [];
  currentNumbers().forEach(n => {
    const p = currentModeProgress()[n];
    if (!p || p.length !== n - 1) {
      // Домик не тронут
      if (state.mode === "add") {
        cards.push({ n, a: 0, b: n, text: `0+${n}` });
        cards.push({ n, a: n, b: 0, text: `${n}+0` });
        for (let a = 1; a <= n - 1; a++) cards.push({ n, a, b: n-a, text: `${a}+${n-a}` });
      } else {
        cards.push({ n, a: 0, b: n, text: `${n}-0` });
        cards.push({ n, a: n, b: 0, text: `${n}-${n}` });
        for (let a = 1; a <= n - 1; a++) cards.push({ n, a, b: n-a, text: `${n}-${a}` });
      }
    } else {
      // Домик частично заполнен
      const placedSet = new Set(p.filter(v => v !== null));
      if (state.mode === "add") {
        if (!placedSet.has(`0+${n}`)) cards.push({ n, a: 0, b: n, text: `0+${n}` });
        if (!placedSet.has(`${n}+0`)) cards.push({ n, a: n, b: 0, text: `${n}+0` });
        for (let a = 1; a <= n - 1; a++) {
          const text = `${a}+${n-a}`, rev = `${n-a}+${a}`;
          if (!placedSet.has(text) && !placedSet.has(rev)) {
            cards.push({ n, a, b: n-a, text });
          }
        }
      } else {
        if (!placedSet.has(`${n}-0`)) cards.push({ n, a: 0, b: n, text: `${n}-0` });
        if (!placedSet.has(`${n}-${n}`)) cards.push({ n, a: n, b: 0, text: `${n}-${n}` });
        for (let a = 1; a <= n - 1; a++) {
          const text = `${n}-${a}`;
          if (!placedSet.has(text)) cards.push({ n, a, b: n-a, text });
        }
      }
    }
  });

  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }

  let idCounter = 0;
  state.tray = cards.map(c => ({ ...c, id: ++idCounter }));
  state.trayInitialSize = state.tray.length; 
}

/* ==================== Проверка размещения ==================== */
function canPlace(n, card) {
  if (card.n !== n) return false;
  const p = ensureHouseProgress(n);
  if (p.every(v => v !== null)) return false; 
  const placed = new Set(p.filter(v => v !== null));
  
  if (state.mode === "add") {
    const text = card.text;
    const rev = `${card.b}+${card.a}`;
    return !placed.has(text) && !placed.has(rev);
  } else {
    return !placed.has(card.text);
  }
}

/* ==================== Отрисовка ==================== */
const housesEl = document.getElementById("houses");
const trayEl = document.getElementById("tray");
const starsEl = document.getElementById("starsCount");
const doneEl = document.getElementById("doneCount");
const trayCountEl = document.getElementById("trayCount");

function renderHeader() {
  const c = completedCount(), t = totalNumbers();
  doneEl.textContent = `Собрано: ${c} / ${t}`;
  starsEl.textContent = c;
  trayCountEl.textContent = `${state.tray.length} / ${state.trayInitialSize}`;
}

function renderHouses() {
  housesEl.innerHTML = "";
  currentNumbers().forEach(n => housesEl.appendChild(buildHouse(n)));
}

function buildHouse(n) {
  const house = document.createElement("div");
  house.className = "house"; house.dataset.number = n;

  const title = document.createElement("div");
  title.className = "house-title"; title.dataset.n = n;
  title.textContent = n;
  title.addEventListener("click", (e) => { e.stopPropagation(); showHint(n); });
  house.appendChild(title);

  const slotsContainer = document.createElement("div");
  slotsContainer.className = "house-slots";

  const p = ensureHouseProgress(n);
  for (let i = 0; i < n - 1; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.index = i;
    
    if (p[i] !== null) {
      slot.textContent = p[i];
      slot.classList.add("filled");
    } else if (state.showGhosts) {
      const ghost = getGhostText(n, i);
      if (ghost) { slot.textContent = ghost; slot.classList.add("ghost"); }
    }
    slot.addEventListener("click", (e) => { e.stopPropagation(); onSlotClick(n, i); });
    slotsContainer.appendChild(slot);
  }

  house.appendChild(slotsContainer);
  return house;
}

function getGhostText(n, i) {
  const p = ensureHouseProgress(n);
  const placed = new Set(p.filter(v => v !== null));
  
  if (state.mode === "add") {
    if (!placed.has(`0+${n}`) && !placed.has(`${n}+0`)) return `0+${n}`;
    for (let a = 1; a <= n - 1; a++) {
      const text = `${a}+${n-a}`;
      const rev = `${n-a}+${a}`;
      if (!placed.has(text) && !placed.has(rev)) return text;
    }
  } else {
    if (!placed.has(`${n}-0`)) return `${n}-0`;
    if (!placed.has(`${n}-${n}`)) return `${n}-${n}`;
    for (let a = 1; a <= n - 1; a++) {
      const text = `${n}-${a}`;
      if (!placed.has(text)) return text;
    }
  }
  return "";
}

function renderSingleHouse(n) {
  const old = housesEl.querySelector('.house[data-number="' + n + '"]');
  if (old) old.replaceWith(buildHouse(n));
}

function renderTray() {
  trayEl.innerHTML = "";
  if (state.tray.length === 0) {
    const empty = document.createElement("div");
    empty.style.color = "var(--muted)"; empty.style.padding = "10px";
    empty.textContent = "Банк пуст";
    trayEl.appendChild(empty); return;
  }
  
  state.tray.forEach(cardData => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = cardData.id;
    card.textContent = cardData.text;
    if (state.selectedCard && state.selectedCard.id === cardData.id) card.classList.add("selected");
    card.addEventListener("click", () => onCardClick(cardData));
    trayEl.appendChild(card);
  });
}

function renderAll() {
  renderHouses(); renderTray(); renderHeader(); applyTheme();
}

/* ==================== Взаимодействие ==================== */
function onCardClick(cardData) {
  if (state.selectedCard && state.selectedCard.id === cardData.id) {
    state.selectedCard = null;
  } else {
    state.selectedCard = cardData;
  }
  renderTray();
}

function onSlotClick(n, index) {
  if (!state.selectedCard) return;
  const card = state.selectedCard;
  
  if (!canPlace(n, card)) {
    const house = housesEl.querySelector('.house[data-number="' + n + '"]');
    if (house) house.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration:220});
    beep(false);
    return;
  }
  
  const p = ensureHouseProgress(n);
  p[index] = card.text;
  takeFromTray(card.id);
  saveProgress();
  state.selectedCard = null;
  
  renderSingleHouse(n); renderTray(); renderHeader();
  
  const slots = housesEl.querySelectorAll('.house[data-number="' + n + '"] .slot');
  if (slots[index]) slots[index].classList.add("pop");
  beep(true);
  
  if (completedCount() === totalNumbers()) showWin();
}

function takeFromTray(id) {
  const idx = state.tray.findIndex(c => c.id === id);
  if (idx !== -1) state.tray.splice(idx, 1);
}

/* ==================== Подсказка ==================== */
let hintTimer = null;
function showHint(n) {
  const cards = trayEl.querySelectorAll(".card");
  cards.forEach(cardEl => cardEl.classList.remove("hint-glow"));
  
  const targetHouse = housesEl.querySelector(`.house[data-number="${n}"]`);
  if (targetHouse) targetHouse.animate([{transform:"scale(1)"},{transform:"scale(1.02)"},{transform:"scale(1)"}], {duration:400});
  
  cards.forEach(cardEl => {
    const id = parseInt(cardEl.dataset.id, 10);
    const cardData = state.tray.find(c => c.id === id);
    if (cardData && canPlace(n, cardData)) cardEl.classList.add("hint-glow");
  });
  
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    cards.forEach(cardEl => cardEl.classList.remove("hint-glow"));
  }, 2000);
}

/* ==================== Образец ==================== */
document.getElementById("sampleBtn").addEventListener("click", () => {
  state.showGhosts = true;
  renderHouses();
  setTimeout(() => { state.showGhosts = false; renderHouses(); }, 2500);
});

/* ==================== Сброс ==================== */
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить прогресс текущего режима?")) return;
  state.progress[state.mode] = {};
  state.selectedCard = null; state.showGhosts = false;
  saveProgress(); buildTrayFromScratch(); renderAll();
});

/* ==================== Победа ==================== */
function showWin() {
  const win = document.getElementById("win");
  document.getElementById("winText").textContent = "Все " + totalNumbers() + " домиков собраны!";
  win.classList.add("show");
  runConfetti();
}
document.getElementById("winAgain").addEventListener("click", () => {
  document.getElementById("win").classList.remove("show");
  state.progress[state.mode] = {}; state.selectedCard = null;
  saveProgress(); buildTrayFromScratch(); renderAll();
});

/* ==================== Конфетти ==================== */
function runConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const colors = ["#e57373","#ffb74d","#fff176","#aed581","#4db6ac","#64b5f6","#9575cd","#f06292"];
  const pieces = [];
  for (let i = 0; i < 100; i++) {
    pieces.push({ x: Math.random()*w, y: -20, vx: (Math.random()-0.5)*2, vy: 2+Math.random()*3, size: 6+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.2 });
  }
  let start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, w, h);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if (t < 3000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, w, h);
  }
  requestAnimationFrame(frame);
}

/* ==================== Звук ==================== */
let audioCtx = null;
function beep(good) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (good) {
      o.type = "sine"; o.frequency.setValueAtTime(660, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.12);
    } else {
      o.type = "square"; o.frequency.setValueAtTime(180, audioCtx.currentTime);
    }
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.22);
  } catch (e) {}
}

/* ==================== Тема ==================== */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const btn = document.getElementById("themeBtn");
  btn.textContent = state.theme === "dark" ? "☀️" : "🌙";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveTheme(); applyTheme();
});

/* ==================== Переключатели ==================== */
document.getElementById("segLevel").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-level]");
  if (!btn || btn.dataset.level === state.level) return;
  state.level = btn.dataset.level;
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
  state.selectedCard = null; state.showGhosts = false;
  rebuildTrayFromProgress(); renderAll();
});

document.getElementById("segMode").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.dataset.mode === state.mode) return;
  state.mode = btn.dataset.mode;
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  state.selectedCard = null; state.showGhosts = false;
  rebuildTrayFromProgress(); renderAll();
});

/* ==================== Инициализация ==================== */
function init() {
  loadProgress(); loadTheme();
  if (!state.progress.add) state.progress.add = {};
  if (!state.progress.sub) state.progress.sub = {};
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  
  const isProgressEmpty = Object.keys(state.progress[state.mode]).length === 0;
  if (isProgressEmpty) buildTrayFromScratch();
  else rebuildTrayFromProgress();
  
  renderAll();
}
init();
</script>
