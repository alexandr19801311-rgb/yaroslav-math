<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiKids — Домики чисел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <main id="menu-container">
        <div class="menu-bg-decor">
          <div class="floating-icon icon-1">🏠</div>
          <div class="floating-icon icon-2">2+3</div>
          <div class="floating-icon icon-3">⭐</div>
          <div class="floating-icon icon-4">7</div>
          <div class="floating-icon icon-5">4+4</div>
          <div class="floating-icon icon-6">🏠</div>
        </div>

        <div class="menu-card">
          <div class="menu-mascot">
            <div class="mascot-eye"></div>
            <div class="mascot-eye"></div>
          </div>
          
          <h1 class="menu-title">Домики чисел</h1>
          <p class="menu-subtitle">Собери все комбинации состава чисел от 2 до 10.</p>
          
          <button id="start-houses-all" class="btn-start-menu">
            <span>Играть</span>
          </button>
        </div>
      </main>

      <main id="game-container" style="display: none;"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
