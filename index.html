<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Состав чисел 2-10 — собери домики (Ярослав)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
    height: 100dvh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 4px 6px;
  }

  /* ===== Шапка ===== */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 0 6px;
    font-size: 14px; font-weight: bold;
    flex-shrink: 0;
  }
  .topbar .title { color: #1976d2; font-size: 16px; }
  .topbar .score { color: #fb8c00; }
  .topbar .progress-text { color: #666; font-size: 13px; }

  /* ===== ДОМИКИ ===== */
  .houses {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 3px;
    flex-shrink: 0;
    margin-bottom: 6px;
    height: 50vh; 
  }

  .house {
    border: 1.5px solid #1976d2;
    border-radius: 6px;
    background: #fff;
    position: relative;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .house.done { border-color: #388e3c; background: #f1f8e9; cursor: default; }
  .house.done::after {
    content: '✅';
    position: absolute; top: 2px; right: 2px;
    font-size: 12px;
  }
  .house.flash-bad { animation: flashBad 0.5s; }
  @keyframes flashBad {
    0%, 100% { background: #fff; }
    50% { background: #ffcdd2; border-color: #d32f2f; }
  }

  .house-title {
    text-align: center;
    font-size: 12px; font-weight: bold;
    color: #fff;
    padding: 3px 0;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    pointer-events: auto; /* Разрешаем клики по заголовку */
    cursor: pointer;
    transition: filter 0.2s;
  }
  .house-title:hover {
    filter: brightness(0.9);
  }

  /* Цвета заголовков */
  .house[data-num="2"]  .house-title { background: #e53935; }
  .house[data-num="3"]  .house-title { background: #fb8c00; }
  .house[data-num="4"]  .house-title { background: #fdd835; color: #333; }
  .house[data-num="5"]  .house-title { background: #7cb342; }
  .house[data-num="6"]  .house-title { background: #00897b; }
  .house[data-num="7"]  .house-title { background: #1e88e5; }
  .house[data-num="8"]  .house-title { background: #5e35b1; }
  .house[data-num="9"]  .house-title { background: #d81b60; }
  .house[data-num="10"] .house-title { background: #6d4c41; }

  .slots-container {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0 2px 2px 2px;
    flex: 1;
  }

  .slot-row {
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold;
    background: #f5f5f5;
    border-radius: 3px;
    border: 1px dashed #bbb;
    color: #bbb;
    pointer-events: none;
    min-height: 22px;
    padding: 1px;
    line-height: 1;
    transition: background 0.2s, border-color 0.2s;
  }

  .slot-row.filled {
    border-style: solid;
    border-color: #1976d2;
    background: #e3f2fd;
    color: #1976d2;
  }

  /* ===== АНИМАЦИЯ ШЛЕПКА ===== */
  @keyframes slot-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); background: #c8e6c9; border-color: #388e3c; color: #2e7d32; }
    100% { transform: scale(1); background: #e3f2fd; border-color: #1976d2; color: #1976d2; }
  }

  .slot-row.pop-anim {
    animation: slot-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    z-index: 2;
  }

  .slot-row.ghost { border-color: #b39ddb; background: #f3e5f5; color: #9575cd; font-style: italic; }
  .slot-row .num-blue { color: #1976d2; }
  .slot-row .op-red { color: #d32f2f; }
  .slot-row .eq { color: #d32f2f; }
  .slot-row .result { color: #1976d2; }
  .slot-row.ghost .num-blue { color: #9575cd; }
  .slot-row.ghost .op-red, .slot-row.ghost .eq, .slot-row.ghost .result { color: #9575cd; }
  
  .slot-row .variant-num { display: none; }

  /* ===== ЛОТОК ===== */
  .tray-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fff9c4;
    border: 2px dashed #f57f17;
    border-radius: 8px;
    padding: 4px 6px;
    min-height: 0;
  }
  .tray-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: bold; color: #e65100;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .tray-header .left { display: flex; align-items: center; gap: 6px; }
  .tray-header .count { background: #fff; padding: 1px 6px; border-radius: 8px; font-size: 11px; color: #666; }
  
  .progress-wrap {
    flex: 1;
    max-width: 200px;
    height: 10px;
    background: #ffe082;
    border-radius: 5px;
    border: 1px solid #f57f17;
    position: relative;
    overflow: hidden;
    margin: 0 10px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #ff9800, #4caf50);
    width: 0%;
  }

  .tray-body {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
    gap: 6px;
    align-content: flex-start;
    overflow-y: auto;
    padding: 2px;
  }

  .card {
    font-family: inherit;
    font-size: 14px; font-weight: bold;
    padding: 4px 0;
    border: 1.5px solid #1976d2;
    background: #fff;
    color: #1976d2;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 1px;
    min-height: 32px;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
  }
  .card.picked {
    background: #bbdefb;
    border-color: #0d47a1;
    box-shadow: 0 2px 6px rgba(13,71,161,0.3);
    transform: scale(1.05);
  }
  
  /* НОВОЕ: Стиль для подсвеченных карточек при клике на домик */
  .card.hint-highlight {
    background: #fff59d;
    border-color: #fbc02d;
    box-shadow: 0 0 8px rgba(251, 192, 45, 0.8);
    transform: scale(1.05);
    z-index: 10;
  }
  
  .card .op { color: #d32f2f; }
  .tray-empty { grid-column: 1 / -1; text-align: center; color: #999; font-size: 13px; padding: 10px; }

  /* ===== Кнопки ===== */
  .controls {
    display: flex; gap: 6px;
    margin-top: 6px;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: bold;
    padding: 6px 16px;
    border: none; border-radius: 6px;
    background: #1976d2; color: #fff;
    cursor: pointer;
  }
  .btn.ghost { background: #fff; color: #1976d2; border: 2px solid #1976d2; }
  .btn.active { background: #7e57c2; border-color: #7e57c2; color: #fff; }

  /* ===== Оверлей ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.96);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
    z-index: 100;
    text-align: center;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 32px; color: #1976d2; margin-bottom: 10px; }
  .overlay .big { font-size: 48px; margin: 14px 0; }

  .saved-badge {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #388e3c; color: #fff;
    padding: 8px 18px;
    border-radius: 18px;
    font-size: 13px; font-weight: bold;
    box-shadow: 0 4px 12px rgba(56,142,60,0.4);
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 150;
    pointer-events: none;
  }
  .saved-badge.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* =================================================================
     АДАПТИВ ПОД УСТРОЙСТВА
     ================================================================= */

  /* 🖥️ КОМПЬЮТЕР */
  @media (min-width: 1100px) {
    .houses {
      grid-template-columns: repeat(3, 1fr);
      height: auto;
    }
    .house { padding: 4px; }
    .house-title { font-size: 14px; padding: 4px 0; margin-bottom: 4px; }
    .slots-container { gap: 4px; padding: 0 4px 4px 4px; }
    .slot-row { font-size: 14px; min-height: 28px; border-radius: 4px; padding-left: 6px;}
  }

  /* 📱 ТЕЛЕФОН */
  @media (max-width: 768px) {
    .houses {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      gap: 8px;
      height: 45vh;
      margin-bottom: 8px;
      padding-bottom: 4px; 
      -webkit-overflow-scrolling: touch;
    }
    
    .houses::-webkit-scrollbar { height: 6px; }
    .houses::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 3px; }
    .houses::-webkit-scrollbar-thumb { background: #1976d2; border-radius: 3px; }

    .house {
      min-width: 110px; 
      scroll-snap-align: start; 
      border-width: 2px;
    }
    
    .house-title { font-size: 14px; padding: 4px 0; }
    .slot-row { font-size: 14px; min-height: 26px; }
    
    .tray-wrap {
      flex: 0 0 35vh;
    }

    .tray-body { grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 4px;}
  }

</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="title">🏠 Состав чисел</div>
    <div class="progress-text">Собрано: <span id="doneCount">0</span> / 9</div>
    <div class="score">⭐ <span id="score">0</span></div>
  </div>

  <div class="houses" id="houses"></div>

  <div class="tray-wrap">
    <div class="tray-header">
      <div class="left">
        <span>🗂️ Карточки:</span>
        <span class="count" id="trayCount">0 / 63</span>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>
    <div class="tray-body" id="trayBody"></div>
  </div>

  <div class="controls">
    <button class="btn" id="sampleBtn">👁️ Показать образец</button>
    <button class="btn ghost" id="resetBtn">🔄 Начать заново</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <h2>🎉 Победа!</h2>
  <p>Ты собрал все 9 домиков!</p>
  <div class="big">⭐ <span id="finalScore">0</span></div>
  <button class="btn" id="playAgain">Играть снова</button>
</div>

<div class="saved-badge" id="savedBadge">💾 Прогресс сохранён</div>

<script>
  const NUMBERS = [2,3,4,5,6,7,8,9,10];
  const data = {};
  const TOTAL_CARDS = NUMBERS.reduce((s, n) => s + (n + 1), 0);
  NUMBERS.forEach(n => {
    const list = [];
    for (let a = 0; a <= n; a++) list.push([a, n - a]);
    data[n] = list;
  });

  const STORAGE_KEY = 'yaroslav_house_progress_v17';

  const state = {
    score: 0,
    done: [],
    filled: {},
    picked: null,
    trayOrder: {},
    sampleOn: false
  };

  const $ = id => document.getElementById(id);

  let audioCtx = null;
  function tone(freq, dur = 0.12, type = 'sine') {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const sndPlace = () => { 
    tone(1200, 0.05, 'triangle'); 
    setTimeout(() => tone(1500, 0.05, 'sine'), 40);
  };
  const sndBad = () => tone(220, 0.18, 'square');
  const sndHouseDone = () => { [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.12),i*100)); };
  const sndWin = () => { [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.15),i*120)); };
  const sndHint = () => tone(800, 0.1, 'sine'); // Звук подсказки

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        score: state.score,
        done: [...state.done],
        filled: state.filled,
        trayOrder: state.trayOrder
      }));
    } catch(e) {}
  }
  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return false;
      state.score = obj.score ?? 0;
      state.done = Array.isArray(obj.done) ? obj.done : [];
      state.filled = obj.filled || {};
      state.trayOrder = obj.trayOrder || {};
      return true;
    } catch(e) { return false; }
  }
  function showSavedBadge() {
    const b = $('savedBadge');
    b.classList.add('show');
    clearTimeout(showSavedBadge._t);
    showSavedBadge._t = setTimeout(() => b.classList.remove('show'), 1200);
  }
  function commit() { saveProgress(); showSavedBadge(); }

  // Отрисовка ОДНОГО домика
  function renderSingleHouse(n, container) {
    const doneSet = new Set(state.done);
    const house = document.createElement('div');
    house.className = 'house';
    house.dataset.num = n;
    if (doneSet.has(n)) house.classList.add('done');
    
    const newHouse = house.cloneNode(false); 
    newHouse.addEventListener('click', (e) => {
      // Если кликнули на заголовок — подсвечиваем карточки
      if (e.target.classList.contains('house-title')) {
        highlightCardsForNumber(n);
      } else {
        // Иначе это обычный клик по домику (вставка карточки)
        onHouseClick(n, newHouse);
      }
    });

    const title = document.createElement('div');
    title.className = 'house-title';
    title.innerHTML = window.innerWidth < 1100 ? n : `ЧИСЛО ${n}`;
    newHouse.appendChild(title);

    const slotsContainer = document.createElement('div');
    slotsContainer.className = 'slots-container';

    data[n].forEach(([a, b], idx) => {
      const key = `${n}-${idx}`;
      const slot = document.createElement('div');
      slot.className = 'slot-row';

      const filled = state.filled[key];
      let content = '';
      if (filled) {
        slot.classList.add('filled');
        content = `<span class="num-blue">${filled.a}</span><span class="op-red">+</span><span class="num-blue">${filled.b}</span><span class="eq">=</span><span class="result">${n}</span>`;
      } else if (state.sampleOn) {
        slot.classList.add('ghost');
        content = `<span class="num-blue">${a}</span><span class="op-red">+</span><span class="num-blue">${b}</span><span class="eq">=</span><span class="result">${n}</span>`;
      } else {
        content = `<span class="num-blue">_</span><span class="op-red">+</span><span class="num-blue">_</span><span class="eq">=</span><span class="result">${n}</span>`;
      }

      slot.innerHTML = content;
      slotsContainer.appendChild(slot);
    });
    
    newHouse.appendChild(slotsContainer);
    
    const oldHouse = container.querySelector(`.house[data-num="${n}"]`);
    if (oldHouse) container.replaceChild(newHouse, oldHouse);
    else container.appendChild(newHouse);
  }

  // Отрисовка всех домиков
  function renderHouses() {
    const container = $('houses');
    if (container.children.length === 0) {
      container.innerHTML = '';
      NUMBERS.forEach(n => renderSingleHouse(n, container));
    } else {
      NUMBERS.forEach(n => {
        const house = container.querySelector(`.house[data-num="${n}"]`);
        if (house) {
          if (state.done.includes(n)) house.classList.add('done');
          else house.classList.remove('done');

          const slots = house.querySelectorAll('.slot-row');
          data[n].forEach(([a, b], idx) => {
            const slot = slots[idx];
            if (!slot) return;
            const filled = state.filled[`${n}-${idx}`];
            
            slot.className = 'slot-row'; 
            let content = '';
            if (filled) {
              slot.classList.add('filled');
              content = `<span class="num-blue">${filled.a}</span><span class="op-red">+</span><span class="num-blue">${filled.b}</span><span class="eq">=</span><span class="result">${n}</span>`;
            } else if (state.sampleOn) {
              slot.classList.add('ghost');
              content = `<span class="num-blue">${a}</span><span class="op-red">+</span><span class="num-blue">${b}</span><span class="eq">=</span><span class="result">${n}</span>`;
            } else {
              content = `<span class="num-blue">_</span><span class="op-red">+</span><span class="num-blue">_</span><span class="eq">=</span><span class="result">${n}</span>`;
            }
            slot.innerHTML = content;
          });
        }
      });
    }
  }

  // Функция для обновления банка карточек
  function renderTray() {
    const body = $('trayBody');
    body.innerHTML = '';

    let totalUsed = 0;
    const allCards = [];
    NUMBERS.forEach(n => {
      data[n].forEach(([a, b], idx) => {
        if (!state.filled[`${n}-${idx}`]) {
          allCards.push({ n, idx, a, b });
        } else {
          totalUsed++;
        }
      });
    });

    const percent = Math.round((totalUsed / TOTAL_CARDS) * 100);
    $('progressBar').style.width = percent + '%';

    if (!state.trayOrder || Object.keys(state.trayOrder).length === 0) {
      state.trayOrder = shuffle(allCards);
    }

    const currentTray = state.trayOrder.filter(c => allCards.some(ac => ac.n === c.n && ac.idx === c.idx));
    const missing = allCards.filter(c => !currentTray.some(tc => tc.n === c.n && tc.idx === c.idx));
    state.trayOrder = [...currentTray, ...missing];

    state.trayOrder.forEach(({ n, idx, a, b }) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.num = n;
      card.dataset.idx = idx;
      card.innerHTML = `<span>${a}</span><span class="op">+</span><span>${b}</span>`;
      if (state.picked && state.picked.num === n && state.picked.idx === idx) {
        card.classList.add('picked');
      }
      card.addEventListener('click', () => onCardClick(n, idx, a, b));
      body.appendChild(card);
    });

    if (body.children.length === 0) {
      body.innerHTML = '<div class="tray-empty">Все карточки расставлены ✅</div>';
    }
    $('trayCount').textContent = `${TOTAL_CARDS - totalUsed} / ${TOTAL_CARDS}`;
  }

  // НОВАЯ ФУНКЦИЯ: Подсветка карточек для конкретного числа
  function highlightCardsForNumber(n) {
    // Если домик уже собран, не подсвечиваем
    if (state.done.includes(n)) return;

    sndHint(); // Звук подсказки

    // Сначала снимаем предыдущую подсветку со всех карточек
    const allCards = document.querySelectorAll('.card');
    allCards.forEach(card => card.classList.remove('hint-highlight'));

    // Добавляем подсветку только тем, которые подходят к числу n
    allCards.forEach(card => {
      if (+card.dataset.num === n) {
        card.classList.add('hint-highlight');
      }
    });

    // Через 2 секунды снимаем подсветку, чтобы не мешала
    clearTimeout(highlightCardsForNumber.timer);
    highlightCardsForNumber.timer = setTimeout(() => {
      document.querySelectorAll('.hint-highlight').forEach(c => c.classList.remove('hint-highlight'));
    }, 2000);
  }

  // При клике на карточку перерисовываем ТОЛЬКО банк
  function onCardClick(n, idx, a, b) {
    if (state.done.includes(n)) return;
    if (state.filled[`${n}-${idx}`]) return;
    if (state.picked && state.picked.num === n && state.picked.idx === idx) {
      state.picked = null;
    } else {
      state.picked = { num: n, idx, a, b };
    }
    
    // Сбрасываем подсветку подсказки при выборе карточки
    document.querySelectorAll('.hint-highlight').forEach(c => c.classList.remove('hint-highlight'));

    renderTray(); 
    
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      if (state.picked && +card.dataset.num === state.picked.num && +card.dataset.idx === state.picked.idx) {
        card.classList.add('picked');
      } else {
        card.classList.remove('picked');
      }
    });
  }

  function onHouseClick(n, houseEl) {
    if (!state.picked) return; 
    if (state.done.includes(n)) return; 

    const { a, b, num } = state.picked;

    if (num !== n || a + b !== n) {
      sndBad();
      houseEl.classList.add('flash-bad');
      setTimeout(() => houseEl.classList.remove('flash-bad'), 500);
      return;
    }

    const targetIdx = data[n].findIndex(([expA, expB], i) => {
      const isFilled = !!state.filled[`${n}-${i}`];
      return !isFilled && expA === a && expB === b;
    });

    if (targetIdx === -1) {
      sndBad();
      houseEl.classList.add('flash-bad');
      setTimeout(() => houseEl.classList.remove('flash-bad'), 500);
      return;
    }

    state.filled[`${n}-${targetIdx}`] = { a, b };
    state.score++;
    sndPlace();
    state.picked = null;

    $('score').textContent = state.score;
    $('doneCount').textContent = state.done.length;

    renderSingleHouse(n, $('houses'));
    renderTray();

    const targetSlot = document.querySelector(`.house[data-num="${n}"] .slot-row:nth-child(${targetIdx + 1})`);
    if (targetSlot) {
      targetSlot.classList.add('pop-anim');
      setTimeout(() => targetSlot.classList.remove('pop-anim'), 400);
    }

    const done = data[n].every((_, i) => state.filled[`${n}-${i}`]);
    if (done && !state.done.includes(n)) {
      state.done.push(n);
      sndHouseDone();
      
      $('doneCount').textContent = state.done.length;
      
      setTimeout(() => {
        if (state.done.length === NUMBERS.length) winGame();
        else { 
          commit(); 
          renderSingleHouse(n, $('houses'));
        }
      }, 600);
    } else {
      commit();
    }
  }

  function renderAll() {
    $('score').textContent = state.score;
    $('doneCount').textContent = state.done.length;
    renderHouses();
    renderTray();
    $('sampleBtn').textContent = state.sampleOn ? '🙈 Скрыть образец' : '👁️ Показать образец';
    $('sampleBtn').classList.toggle('active', state.sampleOn);
  }

  function toggleSample() {
    state.sampleOn = !state.sampleOn;
    tone(state.sampleOn ? 660 : 440, 0.1);
    renderHouses(); 
    $('sampleBtn').textContent = state.sampleOn ? '🙈 Скрыть образец' : '👁️ Показать образец';
    $('sampleBtn').classList.toggle('active', state.sampleOn);
  }

  function winGame() {
    $('finalScore').textContent = state.score;
    $('overlay').classList.add('show');
    sndWin();
    fireConfetti();
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  }

  function fireConfetti() {
    const colors = ['#e53935','#fb8c00','#fdd835','#7cb342','#1e88e5','#5e35b1','#d81b60'];
    for (let i = 0; i < 80; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.6) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  function resetGame() {
    state.score = 0;
    state.done = [];
    state.filled = {};
    state.picked = null;
    state.trayOrder = {};
    state.sampleOn = false;
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
    $('overlay').classList.remove('show');
    $('houses').innerHTML = ''; 
    renderAll();
  }

  $('sampleBtn').addEventListener('click', toggleSample);
  $('resetBtn').addEventListener('click', () => {
    if (confirm('Начать заново? Все успехи сбросятся.')) resetGame();
  });
  $('playAgain').addEventListener('click', resetGame);

  const loaded = loadProgress();
  renderAll();
  if (loaded) {
    setTimeout(() => {
      const b = $('savedBadge');
      b.textContent = '↩️ Прогресс восстановлен';
      b.classList.add('show');
      setTimeout(() => b.classList.remove('show'), 1800);
    }, 300);
  }
</script>

</body>
</html>
