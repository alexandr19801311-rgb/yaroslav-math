<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiKids — Развивающие игры</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎮 LogiKids: Развивающие игры</h1>
      </header>
      
      <main id="menu-container">
        <div class="menu-card">
          <h3>⚡ Быстрый счет</h3>
          <p>Сложение и вычитание на время.</p>
          <div class="difficulty-buttons">
            <button id="start-arith-easy" class="btn-diff btn-easy">Легко</button>
            <button id="start-arith-medium" class="btn-diff btn-medium">Средне</button>
            <button id="start-arith-hard" class="btn-diff btn-hard">Сложно</button>
          </div>
        </div>
        
        <div class="menu-card">
          <h3>⚖️ Умные весы</h3>
          <p>Сравни математические выражения.</p>
          <div class="difficulty-buttons">
            <button id="start-scales-easy" class="btn-diff btn-easy">Легко</button>
            <button id="start-scales-medium" class="btn-diff btn-medium">Средне</button>
            <button id="start-scales-hard" class="btn-diff btn-hard">Сложно</button>
          </div>
        </div>
      </main>

      <main id="game-container" style="display: none;"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
