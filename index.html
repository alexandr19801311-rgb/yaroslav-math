<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Состав чисел 2–10 — Ярослав</title>
<style>
  :root {
    --bg: #f4f7fb; --panel: #ffffff; --text: #1a2233; --muted: #5b6b85;
    --num: #1976d2; --op: #d32f2f; --card-bg: #ffffff; --card-border: #cfd8e3;
    --card-sel: #ffe082; --card-sel-border: #ffb300; --house-bg: #ffffff;
    --house-shadow: 0 4px 14px rgba(30,60,120,.12); --slot-bg: #eef3fa;
    --slot-border: #c7d3e3; --slot-pop: #7ed957; --ghost: #b39ddb;
    --hint: #ffd54f; --star: #f5b301; --btn-bg: #e8eef7;
    --btn-active: #1976d2; --btn-active-text: #ffffff; --win-bg: rgba(255,255,255,.92);
  }
  [data-theme="dark"] {
    --bg: #12161f; --panel: #1b2130; --text: #e8edf5; --muted: #9aa8bd;
    --num: #64b5f6; --op: #ef5350; --card-bg: #232b3d; --card-border: #35405a;
    --card-sel: #5c4a1a; --card-sel-border: #ffb300; --house-bg: #1b2130;
    --house-shadow: 0 4px 14px rgba(0,0,0,.4); --slot-bg: #232b3d;
    --slot-border: #35405a; --slot-pop: #4caf50; --ghost: #7e57c2;
    --hint: #ffb300; --star: #ffca28; --btn-bg: #232b3d;
    --btn-active: #64b5f6; --btn-active-text: #0b1220; --win-bg: rgba(18,22,31,.94);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    background: var(--bg); color: var(--text); transition: background .25s, color .25s; overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 8px 14px; background: var(--panel); box-shadow: 0 2px 10px rgba(30,60,120,.08); z-index: 5;
  }
  .brand { font-size: 1.1rem; font-weight: bold; color: var(--num); white-space: nowrap; }
  .brand small { color: var(--muted); font-weight: normal; font-size: .8rem; }
  .spacer { flex: 1 1 auto; }
  .stats { display: flex; gap: 14px; font-size: .95rem; color: var(--muted); white-space: nowrap; }
  .stats b { color: var(--star); }
  .stats .done b { color: var(--num); }
  .seg { display: inline-flex; background: var(--btn-bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button {
    font-family: inherit; border: none; background: transparent; color: var(--muted);
    padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: .9rem;
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .seg button.active { background: var(--btn-active); color: var(--btn-active-text); font-weight: bold; }
  .icon-btn {
    font-family: inherit; border: none; background: var(--btn-bg); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.2rem;
    display: inline-flex; align-items: center; justify-content: center; transition: background .15s, transform .1s;
  }
  .icon-btn:active { transform: scale(.94); }
  .label-sm { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .control-group { display: flex; flex-direction: column; gap: 2px; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 10px; gap: 10px; }
  #houses {
    flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 10px; overflow: auto;
  }
  .house {
    background: var(--house-bg); border-radius: 14px; box-shadow: var(--house-shadow);
    display: flex; flex-direction: column; align-items: center; padding: 6px;
    cursor: pointer; transition: transform .1s, box-shadow .15s; min-height: 90px; position: relative;
  }
  .house:active { transform: scale(.985); }
  .house-title {
    font-size: 1.5rem; font-weight: bold; margin: 2px 0 6px; cursor: pointer;
    user-select: none; padding: 0 8px; border-radius: 8px; transition: background .15s;
  }
  .house-title:active { background: var(--hint); }
  .slots { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; }
  .slot {
    width: 46px; height: 46px; border-radius: 10px; background: var(--slot-bg);
    border: 2px dashed var(--slot-border); display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: bold; color: var(--num);
    transition: transform .18s, background .18s, border-color .18s, color .18s;
  }
  .slot.filled { background: var(--card-sel); border: 2px solid var(--card-sel-border); border-style: solid; }
  .slot.pop { animation: slot-pop .35s ease; }
  @keyframes slot-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); background: var(--slot-pop); color: #fff; border-color: var(--slot-pop); }
    100% { transform: scale(1); }
  }
  .slot.ghost { color: var(--ghost); border-color: var(--ghost); border-style: dashed; opacity: .85; }
  .op-sign { color: var(--op); font-size: 1.2rem; font-weight: bold; user-select: none; }
  #tray {
    flex: 0 0 auto; background: var(--panel); border-radius: 14px; box-shadow: var(--house-shadow);
    padding: 8px 10px; max-height: 38vh; overflow: auto; display: flex; flex-wrap: wrap;
    gap: 8px; align-content: flex-start; min-height: 64px;
  }
  .card {
    width: 48px; height: 48px; border-radius: 12px; background: var(--card-bg);
    border: 2px solid var(--card-border); display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: bold; color: var(--num); cursor: pointer;
    transition: transform .1s, background .15s, border-color .15s, box-shadow .15s; user-select: none;
  }
  .card:active { transform: scale(.94); }
  .card.selected {
    background: var(--card-sel); border-color: var(--card-sel-border);
    box-shadow: 0 0 0 3px var(--card-sel-border) inset; transform: translateY(-2px);
  }
  .card.hint-glow { animation: hint-glow .6s ease; box-shadow: 0 0 0 4px var(--hint); }
  @keyframes hint-glow { 0%, 100% { box-shadow: 0 0 0 4px var(--hint); } 50% { box-shadow: 0 0 0 8px var(--hint); } }
  .tray-empty { color: var(--muted); font-size: .95rem; padding: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn {
    font-family: inherit; flex: 1 1 auto; min-width: 130px; border: none;
    background: var(--btn-bg); color: var(--text); padding: 10px 14px; border-radius: 12px;
    font-size: .95rem; cursor: pointer; transition: background .15s, transform .1s;
  }
  .action-btn:active { transform: scale(.97); }
  .action-btn.primary { background: var(--num); color: #fff; }
  .action-btn.warn { background: var(--op); color: #fff; }
  #win {
    position: fixed; inset: 0; background: var(--win-bg); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    z-index: 50; padding: 24px; text-align: center;
  }
  #win.show { display: flex; }
  #win h1 { font-size: 2rem; margin: 0; color: var(--num); }
  #win p { font-size: 1.1rem; color: var(--muted); margin: 0; }
  #win .action-btn { flex: 0 0 auto; min-width: 180px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  @media (min-width: 700px) and (orientation: landscape) {
    #houses { grid-template-columns: repeat(9, 1fr); grid-template-rows: 1fr; }
    .house { min-height: 0; }
    .slot { width: 40px; height: 40px; font-size: 1.1rem; }
    .house-title { font-size: 1.3rem; }
    #tray { max-height: 45vh; }
  }
  @media (max-width: 699px) {
    #houses { display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; gap: 10px; }
    #houses .house { flex: 0 0 78%; scroll-snap-align: center; }
    #tray { max-height: 35vh; }
    header { padding: 6px 10px; gap: 6px 10px; }
    .brand { font-size: 1rem; }
    .stats { font-size: .85rem; gap: 10px; }
    .seg button { padding: 5px 8px; font-size: .82rem; }
    .icon-btn { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🧮 Состав чисел <small>для Ярослава</small></div>
    <div class="control-group">
      <span class="label-sm">Уровень</span>
      <div class="seg" id="segLevel">
        <button data-level="low">2–5</button>
        <button data-level="high">6–10</button>
        <button data-level="all" class="active">Все</button>
      </div>
    </div>
    <div class="control-group">
      <span class="label-sm">Режим</span>
      <div class="seg" id="segMode">
        <button data-mode="add" class="active">➕ Сложение</button>
        <button data-mode="sub">➖ Вычитание</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="stats">
      <span class="stars">⭐ <b id="starsCount">0</b></span>
      <span class="done">Собрано: <b id="doneCount">0/9</b></span>
    </div>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  </header>

  <main>
    <section id="houses" aria-label="Домики чисел"></section>
    <section id="tray" aria-label="Банк карточек"></section>
    <div class="actions">
      <button class="action-btn" id="sampleBtn">Показать образец</button>
      <button class="action-btn warn" id="resetBtn">Сбросить прогресс</button>
    </div>
  </main>
</div>

<div id="win">
  <h1>🎉 Победа! 🎉</h1>
  <p id="winText">Все домики собраны!</p>
  <button class="action-btn primary" id="winAgain">Играть снова</button>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";

/* ==================== Константы ==================== */
const LEVELS = {
  low: [2,3,4,5],
  high: [6,7,8,9,10],
  all: [2,3,4,5,6,7,8,9,10]
};
const STORAGE_KEY = "yaroslav_progress_v20";
const THEME_KEY = "yaroslav_theme_v20";

const HOUSE_COLORS = {
  2:"#e57373", 3:"#ffb74d", 4:"#e6c200", 5:"#aed581",
  6:"#4db6ac", 7:"#64b5f6", 8:"#9575cd", 9:"#f06292", 10:"#a1887f"
};

/* ==================== Состояние ==================== */
const state = {
  level: "all",
  mode: "add",
  theme: "light",
  progress: { add: {}, sub: {} },
  selectedCard: null,
  tray: [],        // массив {value, id}
  showGhosts: false,
  ghosts: {}
};

/* ==================== Загрузка/сохранение ==================== */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.add && data.sub) state.progress = data;
    }
  } catch (e) { console.warn("progress load error", e); }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); }
  catch (e) { console.warn("progress save error", e); }
}
function loadTheme() {
  const t = localStorage.getItem(THEME_KEY);
  if (t === "dark" || t === "light") state.theme = t;
}
function saveTheme() { localStorage.setItem(THEME_KEY, state.theme); }

/* ==================== Утилиты ==================== */
function currentNumbers() { return LEVELS[state.level]; }
function currentModeProgress() { return state.progress[state.mode]; }
function ensureNumberProgress(n) {
  const p = currentModeProgress();
  if (!p[n]) p[n] = [null, null];
  return p[n];
}
function isHouseComplete(n) {
  const p = currentModeProgress()[n];
  return p && p[0] !== null && p[1] !== null;
}
function completedCount() { return currentNumbers().filter(isHouseComplete).length; }
function totalNumbers() { return currentNumbers().length; }

/* ==================== Генерация банка ==================== */
/**
 * Собираем полный банк чисел для текущего уровня и режима.
 * В банк кладём все числа от 1 до 9, но с учётом того, сколько раз
 * каждое число нужно, чтобы покрыть все домики.
 *
 * Для режима "Сложение": каждый домик N требует пару (a, b), a+b=N.
 *   Берём все возможные пары: для N=2: (1,1); N=3: (1,2), (2,1); ...
 *   Но чтобы не перегружать банк, для каждого домика берём одну
 *   случайную пару (a,b) с a+b=N. Это даёт ровно 2 карточки на домик.
 *
 * Для режима "Вычитание": каждый домик N требует пару (a, b),
 *   где N - a = b, т.е. a + b = N (то же самое условие!).
 *   Берём одну случайную пару (a,b) с a+b=N.
 *
 * Итог: банк содержит ровно 2 карточки на домик, значения — случайные
 * пары, дающие в сумме N. Перемешиваем.
 */
function buildTrayFromScratch() {
  const values = [];
  currentNumbers().forEach(n => {
    // все пары (a,b) с a+b=n, a>=1, b>=1
    const pairs = [];
    for (let a = 1; a <= n - 1; a++) {
      const b = n - a;
      if (b >= 1) pairs.push([a, b]);
    }
    if (pairs.length === 0) return;
    // выбираем случайную пару
    const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
    values.push(a, b);
  });
  // перемешиваем
  for (let i = values.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [values[i], values[j]] = [values[j], values[i]];
  }
  let idCounter = 0;
  state.tray = values.map(v => ({ value: v, id: ++idCounter }));
}

/**
 * Пересобрать банк с учётом уже стоящих карточек.
 * Для каждого домика смотрим, какие ячейки заполнены.
 * Незаполненные ячейки нужно "докрыть" карточками.
 * Но при этом карточка должна быть совместима с уже стоящей
 * (a+b=N или N-a=b — одно и то же).
 *
 * Проще: для каждого домика заново выбираем случайную пару (a,b) с a+b=N.
 * Если в ячейке уже стоит значение, которое не совпадает с выбранным —
 * это ошибка, но по логике игры такого быть не может (мы не даём
 * поставить неправильную карточку). Поэтому просто пересобираем банк
 * по тем значениям, которые ещё НЕ стоят в домиках, сохраняя
 * совместимость с уже стоящими.
 */
function rebuildTrayFromProgress() {
  const needed = [];
  currentNumbers().forEach(n => {
    const p = ensureNumberProgress(n);
    // Собираем все пары (a,b), a+b=n, совместимые с текущим прогрессом
    const compatible = [];
    for (let a = 1; a <= n - 1; a++) {
      const b = n - a;
      if (b < 1) continue;
      if (p[0] !== null && p[0] !== a) continue;
      if (p[1] !== null && p[1] !== b) continue;
      compatible.push([a, b]);
    }
    if (compatible.length === 0) return; // ничего не нужно
    // выбираем случайную совместимую пару
    const [a, b] = compatible[Math.floor(Math.random() * compatible.length)];
    // докладываем только те ячейки, которые ещё пусты
    if (p[0] === null) needed.push(a);
    if (p[1] === null) needed.push(b);
  });
  for (let i = needed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [needed[i], needed[j]] = [needed[j], needed[i]];
  }
  let idCounter = 0;
  state.tray = needed.map(v => ({ value: v, id: ++idCounter }));
}

function takeFromTray(value) {
  const idx = state.tray.findIndex(c => c.value === value);
  if (idx === -1) return false;
  state.tray.splice(idx, 1);
  return true;
}

/* ==================== Проверка размещения ==================== */
function canPlace(n, c) {
  const p = ensureNumberProgress(n);
  const [a, b] = p;
  if (state.mode === "add") {
    if (a !== null && b !== null) return { ok:false };
    if (a === null && b === null) {
      return (c >= 1 && c <= n - 1) ? { ok:true, slotIndex:0 } : { ok:false };
    }
    if (a === null) return (b + c === n) ? { ok:true, slotIndex:0 } : { ok:false };
    return (a + c === n) ? { ok:true, slotIndex:1 } : { ok:false };
  } else {
    if (a !== null && b !== null) return { ok:false };
    if (a === null && b === null) {
      return (c >= 1 && c <= n - 1) ? { ok:true, slotIndex:0 } : { ok:false };
    }
    if (a === null) {
      return (n - c === b) ? { ok:true, slotIndex:0 } : { ok:false };
    }
    return (n - a === c) ? { ok:true, slotIndex:1 } : { ok:false };
  }
}

/* ==================== Отрисовка ==================== */
const housesEl = document.getElementById("houses");
const trayEl = document.getElementById("tray");
const starsEl = document.getElementById("starsCount");
const doneEl = document.getElementById("doneCount");

function renderHeader() {
  starsEl.textContent = completedCount();
  doneEl.textContent = completedCount() + "/" + totalNumbers();
}

function renderHouses() {
  housesEl.innerHTML = "";
  currentNumbers().forEach(n => housesEl.appendChild(buildHouse(n)));
}

function buildHouse(n) {
  const house = document.createElement("div");
  house.className = "house"; house.dataset.number = n;

  const title = document.createElement("div");
  title.className = "house-title";
  title.style.color = HOUSE_COLORS[n] || "var(--num)";
  title.textContent = n;
  title.addEventListener("click", (e) => { e.stopPropagation(); showHint(n); });
  house.appendChild(title);

  const slots = document.createElement("div");
  slots.className = "slots";
  const p = ensureNumberProgress(n);

  const slot0 = document.createElement("div");
  slot0.className = "slot"; slot0.dataset.slot = "0";
  if (p[0] !== null) { slot0.textContent = p[0]; slot0.classList.add("filled"); }
  else if (state.showGhosts && state.ghosts[n] && state.ghosts[n][0] !== undefined) {
    slot0.textContent = state.ghosts[n][0]; slot0.classList.add("ghost");
  }

  const op = document.createElement("div");
  op.className = "op-sign";
  op.textContent = state.mode === "add" ? "+" : "−";

  const slot1 = document.createElement("div");
  slot1.className = "slot"; slot1.dataset.slot = "1";
  if (p[1] !== null) { slot1.textContent = p[1]; slot1.classList.add("filled"); }
  else if (state.showGhosts && state.ghosts[n] && state.ghosts[n][1] !== undefined) {
    slot1.textContent = state.ghosts[n][1]; slot1.classList.add("ghost");
  }

  slots.appendChild(slot0); slots.appendChild(op); slots.appendChild(slot1);
  house.appendChild(slots);
  house.addEventListener("click", () => onHouseClick(n));
  return house;
}

function renderSingleHouse(n) {
  const old = housesEl.querySelector('.house[data-number="' + n + '"]');
  if (old) old.replaceWith(buildHouse(n));
}

function renderTray() {
  trayEl.innerHTML = "";
  if (state.tray.length === 0) {
    const empty = document.createElement("div");
    empty.className = "tray-empty"; empty.textContent = "Банк пуст";
    trayEl.appendChild(empty); return;
  }
  const sorted = [...state.tray].sort((a,b) => a.value - b.value);
  sorted.forEach(cardData => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.value = cardData.value;
    card.dataset.id = cardData.id;
    card.textContent = cardData.value;
    if (state.selectedCard && state.selectedCard.id === cardData.id) card.classList.add("selected");
    card.addEventListener("click", () => onCardClick(cardData));
    trayEl.appendChild(card);
  });
}

function renderAll() {
  renderHouses(); renderTray(); renderHeader(); applyTheme();
}

/* ==================== Взаимодействие ==================== */
function onCardClick(cardData) {
  if (state.selectedCard && state.selectedCard.id === cardData.id) state.selectedCard = null;
  else state.selectedCard = cardData;
  renderTray();
}

function onHouseClick(n) {
  if (!state.selectedCard) return;
  const c = state.selectedCard.value;
  const res = canPlace(n, c);
  if (!res.ok) {
    const house = housesEl.querySelector('.house[data-number="' + n + '"]');
    if (house) {
      house.animate(
        [{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],
        {duration:220}
      );
    }
    beep(false); return;
  }
  const p = ensureNumberProgress(n);
  p[res.slotIndex] = c;
  takeFromTray(c);
  saveProgress();
  state.selectedCard = null;
  renderSingleHouse(n); renderTray(); renderHeader();
  const slot = housesEl.querySelector('.house[data-number="' + n + '"] .slot[data-slot="' + res.slotIndex + '"]');
  if (slot) slot.classList.add("pop");
  beep(true);
  if (completedCount() === totalNumbers()) showWin();
}

/* ==================== Подсказка ==================== */
let hintTimer = null;
function showHint(n) {
  const cards = trayEl.querySelectorAll(".card");
  cards.forEach(card => card.classList.remove("hint-glow"));
  cards.forEach(card => {
    const c = parseInt(card.dataset.value, 10);
    const res = canPlace(n, c);
    if (res.ok) card.classList.add("hint-glow");
  });
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    cards.forEach(card => card.classList.remove("hint-glow"));
  }, 2000);
}

/* ==================== Образец ==================== */
document.getElementById("sampleBtn").addEventListener("click", () => {
  state.ghosts = {};
  currentNumbers().forEach(n => {
    const p = ensureNumberProgress(n);
    // показываем первую подходящую пару (a,b), a+b=n
    let a = 1, b = n - 1;
    if (p[0] !== null) a = p[0];
    if (p[1] !== null) b = p[1];
    if (p[0] === null && p[1] !== null) a = n - p[1];
    if (p[1] === null && p[0] !== null) b = n - p[0];
    state.ghosts[n] = [a, b];
  });
  state.showGhosts = true;
  renderHouses();
  setTimeout(() => {
    state.showGhosts = false; state.ghosts = {}; renderHouses();
  }, 2500);
});

/* ==================== Сброс прогресса ==================== */
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить прогресс текущего режима (" + (state.mode === "add" ? "сложение" : "вычитание") + ")?")) return;
  state.progress[state.mode] = {};
  state.selectedCard = null; state.showGhosts = false; state.ghosts = {};
  saveProgress(); buildTrayFromScratch(); renderAll();
});

/* ==================== Победа ==================== */
function showWin() {
  const win = document.getElementById("win");
  const txt = document.getElementById("winText");
  txt.textContent = "Все " + totalNumbers() + " домиков собраны в режиме «" +
    (state.mode === "add" ? "Сложение" : "Вычитание") + "»!";
  win.classList.add("show"); runConfetti();
}
document.getElementById("winAgain").addEventListener("click", () => {
  document.getElementById("win").classList.remove("show");
  state.progress[state.mode] = {}; state.selectedCard = null;
  saveProgress(); buildTrayFromScratch(); renderAll();
});

/* ==================== Конфетти ==================== */
function runConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const colors = ["#e57373","#ffb74d","#fff176","#aed581","#4db6ac","#64b5f6","#9575cd","#f06292"];
  const pieces = [];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * w, y: -20 - Math.random() * h * 0.5,
      vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
      size: 6 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2
    });
  }
  let start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, w, h);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (t < 3000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, w, h);
  }
  requestAnimationFrame(frame);
}

/* ==================== Звук ==================== */
let audioCtx = null;
function beep(good) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (good) {
      o.type = "sine";
      o.frequency.setValueAtTime(660, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.12);
    } else {
      o.type = "square"; o.frequency.setValueAtTime(180, audioCtx.currentTime);
    }
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.22);
  } catch (e) {}
}

/* ==================== Тема ==================== */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const btn = document.getElementById("themeBtn");
  btn.textContent = state.theme === "dark" ? "☀️" : "🌙";
  btn.title = state.theme === "dark" ? "Светлая тема" : "Тёмная тема";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveTheme(); applyTheme();
});

/* ==================== Переключатели ==================== */
document.getElementById("segLevel").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-level]");
  if (!btn || btn.dataset.level === state.level) return;
  state.level = btn.dataset.level;
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
  state.selectedCard = null; state.showGhosts = false; state.ghosts = {};
  rebuildTrayFromProgress(); renderAll();
});

document.getElementById("segMode").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn || btn.dataset.mode === state.mode) return;
  state.mode = btn.dataset.mode;
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  state.selectedCard = null; state.showGhosts = false; state.ghosts = {};
  rebuildTrayFromProgress(); renderAll();
});

/* ==================== Инициализация ==================== */
function init() {
  loadProgress(); loadTheme();
  if (!state.progress.add) state.progress.add = {};
  if (!state.progress.sub) state.progress.sub = {};
  document.querySelectorAll("#segLevel button").forEach(b => b.classList.toggle("active", b.dataset.level === state.level));
  document.querySelectorAll("#segMode button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  rebuildTrayFromProgress(); renderAll();
}
init();
</script>
